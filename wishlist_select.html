<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ListEm</title>
        <link rel="icon" type="image/x-icon" href="/img/L_icon.png">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <label class="lightMode">
            <input type="checkbox" id="mode">
            <span class="toggle"></span>
        </label>
        <div class="title" id="viewWishlistTitle">View A Wishlist</div>
        <div style="display: flex; justify-content: center;">
            <div class="select" id="wishlistSelect"></div>
        </div>
        <br/>
        <div style="display: flex; justify-content: center;">
            <button class="button-style" id="myWishlistBtn" style="height: 120px;">My Wishlist</button>
        </div>
        <br/>
        <button id="backBtn" style="margin-left: 2.5%;">Back</button>
        <script type="module" src="wishlist_select.js"></script>
    </body>
</html>
