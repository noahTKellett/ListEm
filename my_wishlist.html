<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title id="title">ListEm - My Wishlist</title>
        <link rel="icon" type="image/x-icon" href="/img/L_icon.png">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <label class="lightMode">
            <input type="checkbox" id="mode">
            <span class="toggle"></span>
        </label>
        <div class="title" id="userWishlistTitle">My Wishlist</div>
        <br/>
        <ul class="list" id="myList"></ul>
        <br/>
        <button id="backBtn" style="margin-left: 2.5%;">Back</button>
        <button id="addItemBtn">Add Item</button>
        <dialog id="deletePopup" class="popup">
            <div>
                <form method="dialog">
                    <div style="display: flex; justify-content: center;">
                        <img src="img/deleteWarning.png" alt="delete warning" class="popup-image">
                    </div>
                    <h2 id="deleteHeading">Do you wish to delete</h2>
                    <h2 id="deleteHeadItemName"></h2>
                    <div id="buttonContainer" style="display: flex; justify-content: space-around; padding: 2%;">
                        <button id="yesOption">Delete Item</button>
                        <button id="noOption">Keep Item</button>
                    </div>
                </form>
            </div>
        </dialog>
        <dialog id="addPopup" class="popup">
            <div>
                <form method="dialog">
                    <div style="display: flex; justify-content: center;">
                        <img src="img/addSymbol.png" alt="add image" class="popup-image">
                    </div>
                    <h2>New Item Information</h2>
                    <div id="addPopupImg">
                        <label id="imgLbl">Image URL</label>
                        <br/>
                        <input type="text" id="imgFld"></input>
                        <img alt="image preview" class="popup-image" id="imgPreview">
                    </div>
                    <br/>
                    <div id="addPopupName">
                        <label id="nameLbl">Item Name</label>
                        <br/>
                        <input type="text" id="nameFld"></input>
                    </div>
                    <br/>
                    <div id="addPopupDescr">
                        <label id="descrLbl">Description</label>
                        <br/>
                        <textarea type="text" id="descrFld" style="min-height: 80px; width: 100%;"></textarea>
                    </div>
                    <br/>
                    <div id="addPopupPrice">
                        <label id="priceLbl">Price (CAD)</label>
                        <br/>
                        <input type="text" inputmode="decimal" pattern="[0-9]*([\.,][0-9]{2})?"
                            oninput="this.value = this.value.replace(/[^0-9.,]/g, '').replace(/(\..*?)\..*/g, '$1');"
                            placeholder="0.00" id="priceFld"></input>
                    </div>
                </form>
                <br/>
                <button id="addBtn">Add</button>
            </div>
        </dialog>
        <script type="module" src="my_wishlist.js"></script>
    </body>
</html>
